<!DOCTYPE html>

<body>

    <script src="/static/js/sync.js"></script>
    <script src="/static/js/api.js"></script>

        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/static/js/service-worker.js");
            });
        }
    </script>
</body>
</html>
